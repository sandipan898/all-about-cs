name: Usage guard

# Daily budget watchdog. Opens/updates a single "actions-usage-alert" issue when
# GitHub Actions minutes cross USAGE_ALERT_THRESHOLD, so you get a heads-up
# BEFORE any overage charge — even if you never look at the Actions tab.
on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch:
  repository_dispatch:
    types: [usage]

permissions:
  contents: read
  issues: write

jobs:
  guard:
    name: Check Actions minutes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Usage check + alert
        run: npm run auto -- usage --alert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USAGE_WARN_THRESHOLD: ${{ vars.USAGE_WARN_THRESHOLD }}
          USAGE_ALERT_THRESHOLD: ${{ vars.USAGE_ALERT_THRESHOLD }}
